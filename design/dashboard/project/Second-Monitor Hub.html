<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Second-Monitor Hub — Wireframes</title>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wf-primitives.jsx"></script>
<script type="text/babel" src="wf-hub.jsx"></script>
<script type="text/babel" src="wf-screens-1.jsx"></script>
<script type="text/babel" src="wf-screens-2.jsx"></script>

<script type="text/babel" data-presets="react">
  // Hub canvas is 2560×1440. Scale options:
  //   - main hub artboards: 0.5 → 1280×720 cards
  //   - secondary screens: 0.45 → 1152×648 cards
  const HUB_SCALE_MAIN = 0.5;
  const HUB_SCALE_SECONDARY = 0.45;

  function App() {
    return (
      <DesignCanvas>

        <DCSection id="intro" title="Second-Monitor Hub" subtitle="Mid-fi wireframes · 2560×1440 hub canvas · cyan accent reserved for the visualizer">
          <DCArtboard id="brief" label="Brief · system" width={1280} height={720}>
            <Brief />
          </DCArtboard>
        </DCSection>

        <DCSection id="layouts" title="01 · Hub layouts" subtitle="Four directions for arranging tiles on a single 2560×1440 monitor. All viz-prominent.">
          <DCArtboard id="layout-a" label="A · Asymmetric viz-dominant" width={2560 * HUB_SCALE_MAIN} height={1440 * HUB_SCALE_MAIN}>
            <HubLayoutA scale={HUB_SCALE_MAIN} />
          </DCArtboard>
          <DCArtboard id="layout-b" label="B · Bento — viz at center" width={2560 * HUB_SCALE_MAIN} height={1440 * HUB_SCALE_MAIN}>
            <HubLayoutB scale={HUB_SCALE_MAIN} />
          </DCArtboard>
          <DCArtboard id="layout-c" label="C · Sidebar + ambient hero" width={2560 * HUB_SCALE_MAIN} height={1440 * HUB_SCALE_MAIN}>
            <HubLayoutC scale={HUB_SCALE_MAIN} />
          </DCArtboard>
          <DCArtboard id="layout-d" label="D · Fullscreen ambient + glass" width={2560 * HUB_SCALE_MAIN} height={1440 * HUB_SCALE_MAIN}>
            <HubLayoutD scale={HUB_SCALE_MAIN} />
          </DCArtboard>
        </DCSection>

        <DCSection id="edit" title="02 · Edit mode" subtitle="Figma-style toolbar + drag handles + properties panel. Selected tile shows resize handles, smart guides, dimensions.">
          <DCArtboard id="edit-mode" label="Edit mode · viz tile selected" width={2560 * HUB_SCALE_MAIN} height={1440 * HUB_SCALE_MAIN}>
            <HubEditMode scale={HUB_SCALE_MAIN} />
          </DCArtboard>
          <DCArtboard id="tile-picker" label="Add tile · picker modal" width={2560 * HUB_SCALE_MAIN} height={1440 * HUB_SCALE_MAIN}>
            <TilePicker scale={HUB_SCALE_MAIN} />
          </DCArtboard>
        </DCSection>

        <DCSection id="viz" title="03 · Visualizer config (full-screen page)" subtitle="Big preview · all 5 modes as a strip · per-mode + global controls · preset save/import/export">
          <DCArtboard id="viz-config" label="Viz config · Bars selected" width={2560 * HUB_SCALE_MAIN} height={1440 * HUB_SCALE_MAIN}>
            <VizConfigPage scale={HUB_SCALE_MAIN} />
          </DCArtboard>
        </DCSection>

        <DCSection id="sysmon" title="04 · System monitor drilldown" subtitle="Detailed mode · all metrics · top processes · sampling rate switch">
          <DCArtboard id="sysmon-detail" label="Sysmon · detailed view" width={2560 * HUB_SCALE_MAIN} height={1440 * HUB_SCALE_MAIN}>
            <SysMonDrilldown scale={HUB_SCALE_MAIN} />
          </DCArtboard>
        </DCSection>

        <DCSection id="profiles" title="05 · Layout profile switcher" subtitle="Global hotkey overlay · live previews of saved layouts · ⌘ 1/2/3 to apply">
          <DCArtboard id="profile-switcher" label="Profile switcher overlay" width={2560 * HUB_SCALE_MAIN} height={1440 * HUB_SCALE_MAIN}>
            <ProfileSwitcher scale={HUB_SCALE_MAIN} />
          </DCArtboard>
        </DCSection>

        <DCSection id="settings" title="06 · Settings / preferences" subtitle="Sidebar nav · performance budget surfaced as live current vs. target">
          <DCArtboard id="settings" label="Settings · Performance budget" width={2560 * HUB_SCALE_MAIN} height={1440 * HUB_SCALE_MAIN}>
            <SettingsPage scale={HUB_SCALE_MAIN} />
          </DCArtboard>
        </DCSection>

        <DCSection id="onboarding" title="07 · First-launch onboarding" subtitle="Ambient viz behind · 4 starter layouts · stepwise wizard">
          <DCArtboard id="onboarding" label="Welcome · pick a layout" width={2560 * HUB_SCALE_MAIN} height={1440 * HUB_SCALE_MAIN}>
            <OnboardingPage scale={HUB_SCALE_MAIN} />
          </DCArtboard>
        </DCSection>

      </DesignCanvas>
    );
  }

  function Brief() {
    return (
      <div style={{ width: '100%', height: '100%', padding: 60, boxSizing: 'border-box', background: '#fff', color: '#222', fontSize: 14, lineHeight: 1.55, fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif' }}>
        <div style={{ fontSize: 11, letterSpacing: '.1em', textTransform: 'uppercase', color: '#888', marginBottom: 12 }}>Wireframe set · v0.1</div>
        <h1 style={{ fontSize: 36, margin: '0 0 8px', letterSpacing: '-0.02em', fontWeight: 700 }}>Second-Monitor Hub</h1>
        <div style={{ fontSize: 15, color: '#666', marginBottom: 28, maxWidth: 720 }}>
          A persistent, configurable second-monitor desktop that consolidates comms, media, system telemetry,
          and a flagship audio visualizer into one tiled workspace. Mid-fi wireframes covering the full vision
          (MVP through Phase 3).
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 32, maxWidth: 1100 }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '.08em', textTransform: 'uppercase', color: '#888', marginBottom: 10 }}>What's covered</div>
            <ol style={{ paddingLeft: 18, margin: 0, color: '#222' }}>
              <li><b>Hub layouts</b> — 4 directions for arranging tiles</li>
              <li><b>Edit mode</b> — Figma-style toolbar + properties panel</li>
              <li><b>Tile picker</b> — categorized add-tile flow</li>
              <li><b>Visualizer config</b> — full-screen, all 5 modes</li>
              <li><b>System monitor drilldown</b> — detailed view</li>
              <li><b>Profile switcher</b> — overlay w/ live previews</li>
              <li><b>Settings</b> — performance budget as live target</li>
              <li><b>Onboarding</b> — first-launch wizard</li>
            </ol>
          </div>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '.08em', textTransform: 'uppercase', color: '#888', marginBottom: 10 }}>System</div>
            <ul style={{ paddingLeft: 18, margin: 0, color: '#222' }}>
              <li>Canvas 2560×1440, scaled 0.5 in artboards</li>
              <li>Dark hub UI · cool grays</li>
              <li><span style={{ background: '#7cf5d4', color: '#000', padding: '0 6px', borderRadius: 3, fontSize: 12, fontWeight: 600 }}>Cyan accent</span> reserved for the visualizer + selection state</li>
              <li>Inter (UI), JetBrains Mono (data), Caveat (annotations)</li>
              <li>Visualizers are real SVG, animated — preview in place</li>
            </ul>
          </div>
        </div>

        <div style={{ marginTop: 36, padding: 16, background: '#f7f5f0', border: '1px solid #e2ddd2', borderRadius: 8, color: '#544', maxWidth: 1100 }}>
          <b>Wireframe vibe:</b> structure-first. Real type, real spacing, real components — but stylized
          enough to be scanned as ideas rather than nailed-down visual design. The viz mode picker, edit-mode
          handles, and budget table are the load-bearing interactions worth your eye.
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

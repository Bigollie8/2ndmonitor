<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Second-Monitor Hub — Layout C · Hi-Fi Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<style>
  html, body { margin: 0; padding: 0; background: #000; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #fff; overflow: hidden; }
  #root { width: 100vw; height: 100vh; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="wf-primitives.jsx"></script>
<script type="text/babel" src="hifi-viz.jsx"></script>
<script type="text/babel" src="hifi-tiles.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="hifi-modes.jsx"></script>

<script type="text/babel" data-presets="react">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "vizMode": "bars",
    "accentTheme": "auto",
    "density": "compact"
  }/*EDITMODE-END*/;

  // Manual accent palettes (when not auto/theme-linked)
  const ACCENT_PALETTES = {
    auto:    { label: 'Theme-linked' },
    mint:    { label: 'Mint',   accent: '#7cf5d4', accent2: '#a78bfa' },
    coral:   { label: 'Coral',  accent: '#fb7185', accent2: '#facc15' },
    indigo:  { label: 'Indigo', accent: '#818cf8', accent2: '#06b6d4' },
    amber:   { label: 'Amber',  accent: '#fbbf24', accent2: '#fb7185' },
  };

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const [track, setTrack] = React.useState(TRACKS[0]);
    const [editMode, setEditMode] = React.useState(false);
    const [profile, setProfile] = React.useState('work');
    const [showSwitcher, setShowSwitcher] = React.useState(false);
    const [showOnboarding, setShowOnboarding] = React.useState(false);

    // Resolve accent
    const palette = ACCENT_PALETTES[t.accentTheme] || ACCENT_PALETTES.auto;
    const accent = palette.accent || track.accent;
    const accent2 = palette.accent2 || track.accent2;
    const accentLinked = t.accentTheme === 'auto';

    // Cycle viz mode
    const cycleMode = () => {
      const modes = ['bars', 'waveform', 'radial', 'particles', 'ambient'];
      const i = modes.indexOf(t.vizMode);
      setTweak('vizMode', modes[(i + 1) % modes.length]);
    };

    // Apply CSS vars for theme-linked anywhere
    React.useEffect(() => {
      document.documentElement.style.setProperty('--accent', accent);
      document.documentElement.style.setProperty('--accent2', accent2);
    }, [accent, accent2]);

    // Keyboard shortcuts
    React.useEffect(() => {
      const onKey = (e) => {
        const cmd = e.metaKey || e.ctrlKey;
        if (cmd && e.key === 'e') { e.preventDefault(); setEditMode(m => !m); }
        else if (cmd && (e.key === '1' || e.key === '2' || e.key === '3')) {
          e.preventDefault();
          setProfile(['work', 'gaming', 'chill'][parseInt(e.key) - 1]);
        }
        else if (e.key === 'Escape') {
          if (showSwitcher) setShowSwitcher(false);
          else if (editMode) setEditMode(false);
          else if (showOnboarding) setShowOnboarding(false);
        }
      };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, [showSwitcher, editMode, showOnboarding]);

    // Scale the fixed 2560x1440 canvas to fit viewport
    const [scale, setScale] = React.useState(1);
    React.useEffect(() => {
      const fit = () => {
        const s = Math.min(window.innerWidth / 2560, window.innerHeight / 1440);
        setScale(s);
      };
      fit();
      window.addEventListener('resize', fit);
      return () => window.removeEventListener('resize', fit);
    }, []);

    return (
      <div style={{ width: '100vw', height: '100vh', background: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden' }}>
      <div style={{ width: 2560, height: 1440, transform: `scale(${scale})`, transformOrigin: 'center center', flexShrink: 0, background: '#06070a', position: 'relative', overflow: 'hidden', borderRadius: 8 }}>
        {/* Top chrome */}
        <TopChrome accent={accent} editMode={editMode} setEditMode={setEditMode} accentLinked={accentLinked} track={track} profile={profile} setProfile={setProfile} onSwitcher={() => setShowSwitcher(true)} onOnboarding={() => setShowOnboarding(true)} />

        {/* Main grid: left rail + right content */}
        <div style={{
          position: 'absolute', top: 56, bottom: 32, left: 20, right: 20,
          display: 'grid',
          gridTemplateColumns: '560px 1fr',
          gridTemplateRows: '1fr',
          gap: getDensity(t.density).gap,
        }}>
          {/* Left rail — 5 stacked tiles */}
          <div style={{ display: 'grid', gridTemplateRows: '1.4fr 1fr 0.7fr 0.6fr 0.6fr', gap: getDensity(t.density).gap, minHeight: 0 }}>
            <DiscordHiFi density={t.density} accent={accent} />
            <SpotifyHiFi density={t.density} accent={accent} accent2={accent2} track={track} onPick={setTrack} />
            <CalendarHiFi density={t.density} accent={accent} />
            <NotesHiFi density={t.density} accent={accent} />
            <WebHiFi density={t.density} accent={accent} url="linear.app/inbox" title="Linear" />
          </div>

          {/* Right: viz hero + bottom strip */}
          <div style={{ display: 'grid', gridTemplateRows: '1fr 360px', gap: getDensity(t.density).gap, minHeight: 0 }}>
            <VizHero
              mode={t.vizMode}
              setMode={(m) => setTweak('vizMode', m)}
              accent={accent}
              accent2={accent2}
              track={track}
              accentLinked={accentLinked}
            />
            <div style={{ display: 'grid', gridTemplateColumns: '1.6fr 1fr 1fr', gap: getDensity(t.density).gap, minHeight: 0 }}>
              <SysMonHiFi density={t.density} accent={accent} accent2={accent2} />
              <ClockHiFi density={t.density} accent={accent} accent2={accent2} />
              <CalendarStripHiFi density={t.density} accent={accent} />
            </div>
          </div>
        </div>

        {/* Bottom status bar */}
        <BottomStatus accent={accent} onSwitcher={() => setShowSwitcher(true)} onOnboarding={() => setShowOnboarding(true)} profile={profile} />

        {/* Edit mode overlay */}
        {editMode && <EditModeOverlay accent={accent} accent2={accent2} onExit={() => setEditMode(false)} />}

        {/* Profile switcher */}
        {showSwitcher && <ProfileSwitcher accent={accent} currentProfile={profile} setProfile={setProfile} onClose={() => setShowSwitcher(false)} onCreate={() => setShowSwitcher(false)} />}

        {/* Onboarding */}
        {showOnboarding && <Onboarding accent={accent} onFinish={() => setShowOnboarding(false)} />}
      </div>

        {/* Tweaks - outside scaled canvas so it stays usable */}
        <TweaksPanel title="Tweaks">
          <TweakSection label="Visualizer" />
          <TweakRadio label="Mode" value={t.vizMode}
            options={['bars', 'waveform', 'radial', 'particles', 'ambient']}
            onChange={(v) => setTweak('vizMode', v)} />
          <TweakSection label="Accent color" />
          <TweakSelect label="Source" value={t.accentTheme}
            options={Object.keys(ACCENT_PALETTES).map(k => ({ value: k, label: ACCENT_PALETTES[k].label }))}
            onChange={(v) => setTweak('accentTheme', v)} />
          <div style={{ display: 'flex', gap: 6, padding: '4px 0', alignItems: 'center' }}>
            <div style={{ width: 22, height: 22, borderRadius: 5, background: accent, border: '1px solid rgba(0,0,0,0.1)' }} />
            <div style={{ width: 22, height: 22, borderRadius: 5, background: accent2, border: '1px solid rgba(0,0,0,0.1)' }} />
            <span style={{ fontSize: 10, color: 'rgba(41,38,27,0.55)', fontFamily: 'JetBrains Mono, ui-monospace, monospace', marginLeft: 4 }}>
              {accentLinked ? `from "${track.title}"` : 'manual'}
            </span>
          </div>
          <TweakSection label="Layout" />
          <TweakRadio label="Tile density" value={t.density}
            options={['compact', 'regular', 'spacious']}
            onChange={(v) => setTweak('density', v)} />
          <TweakSection label="Demo screens" />
          <TweakButton label="Edit mode" onClick={() => setEditMode(true)} />
          <TweakButton label="Profile switcher" onClick={() => setShowSwitcher(true)} />
          <TweakButton label="First-launch onboarding" onClick={() => setShowOnboarding(true)} />
        </TweaksPanel>
      </div>
    );
  }

  function TopChrome({ accent, editMode, setEditMode, accentLinked, track, profile, setProfile, onSwitcher, onOnboarding }) {
    const PROFILES = [{ id: 'work', name: 'Work' }, { id: 'gaming', name: 'Gaming' }, { id: 'chill', name: 'Chill' }];
    return (
      <div style={{
        position: 'absolute', top: 0, left: 0, right: 0, height: 56,
        background: 'rgba(8,9,12,0.85)', backdropFilter: 'blur(20px)',
        borderBottom: '1px solid rgba(255,255,255,0.05)',
        display: 'flex', alignItems: 'center', padding: '0 18px', gap: 16, zIndex: 10,
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ width: 16, height: 16, borderRadius: 5, background: `linear-gradient(135deg, ${accent}, ${accent}99)`, boxShadow: `0 0 12px ${accent}66` }} />
          <span style={{ fontSize: 12, fontWeight: 700, letterSpacing: '-0.01em' }}>Hub</span>
        </div>
        <div style={{ width: 1, height: 18, background: 'rgba(255,255,255,0.08)' }} />
        <div style={{ display: 'flex', gap: 4 }}>
          {PROFILES.map((p) => {
            const active = profile === p.id;
            return (
              <button key={p.id} onClick={() => setProfile(p.id)} style={{
                padding: '5px 12px', fontSize: 11, borderRadius: 6,
                background: active ? `${accent}20` : 'transparent',
                color: active ? accent : 'rgba(255,255,255,0.5)',
                border: active ? `1px solid ${accent}55` : '1px solid transparent',
                cursor: 'pointer', fontWeight: active ? 600 : 400,
              }}>{p.name}</button>
            );
          })}
          <button onClick={onSwitcher} title="Open profile switcher" style={{
            padding: '5px 8px', fontSize: 11, borderRadius: 6,
            background: 'transparent', color: 'rgba(255,255,255,0.4)',
            border: '1px solid transparent', cursor: 'pointer',
          }}>⌃ More</button>
        </div>
        <div style={{ flex: 1 }} />
        {accentLinked && (
          <span style={{ fontSize: 10, color: accent, padding: '3px 8px', background: accent + '15', borderRadius: 4, border: `1px solid ${accent}44`, letterSpacing: '.05em' }}>
            ◐ Theme synced to "{track.title}"
          </span>
        )}
        <button onClick={onOnboarding} title="Replay first-launch setup" style={{
          padding: '5px 10px', fontSize: 11, borderRadius: 6,
          background: 'transparent', color: 'rgba(255,255,255,0.5)',
          border: '1px solid rgba(255,255,255,0.1)',
          cursor: 'pointer', fontWeight: 500,
        }}>↻ Setup</button>
        <button onClick={() => setEditMode(!editMode)} style={{
          padding: '5px 10px', fontSize: 11, borderRadius: 6,
          background: editMode ? accent : 'transparent', color: editMode ? '#000' : 'rgba(255,255,255,0.7)',
          border: editMode ? 'none' : '1px solid rgba(255,255,255,0.1)',
          cursor: 'pointer', fontWeight: 600,
        }}>✎ Edit</button>
        <span style={{ fontSize: 11, color: 'rgba(255,255,255,0.4)', fontFamily: 'JetBrains Mono, ui-monospace, monospace' }}>2560×1440</span>
      </div>
    );
  }

  function VizHero({ mode, setMode, accent, accent2, track, accentLinked }) {
    return (
      <div style={{
        position: 'relative', overflow: 'hidden',
        borderRadius: 14,
        background: '#06070a',
        border: '1px solid rgba(255,255,255,0.05)',
        boxShadow: `0 0 60px -20px ${accent}66`,
      }}>
        <HiFiVizSurface mode={mode} accent={accent} accent2={accent2} />
        {/* Dim gradient at top + bottom for chrome legibility */}
        <div style={{
          position: 'absolute', inset: 0, pointerEvents: 'none',
          background: 'linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 18%, transparent 75%, rgba(0,0,0,0.55) 100%)',
        }} />
        <VizOverlay track={track} mode={mode} setMode={setMode} accent={accent} accent2={accent2} />
      </div>
    );
  }

  function BottomStatus({ accent, onSwitcher, onOnboarding, profile }) {
    return (
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, height: 32,
        background: 'rgba(8,9,12,0.85)', backdropFilter: 'blur(20px)',
        borderTop: '1px solid rgba(255,255,255,0.05)',
        display: 'flex', alignItems: 'center', padding: '0 18px', gap: 18, zIndex: 10,
        fontSize: 10.5, color: 'rgba(255,255,255,0.45)', fontFamily: 'JetBrains Mono, ui-monospace, monospace',
      }}>
        <span style={{ color: accent }}>● 8 tiles</span>
        <span>CPU 1.2%</span>
        <span>RAM 142 MB</span>
        <span>GPU 3.1%</span>
        <span>Audio: WASAPI loopback</span>
        <div style={{ flex: 1 }} />
        <button onClick={onSwitcher} style={{ background: 'transparent', border: 'none', color: 'rgba(255,255,255,0.45)', fontFamily: 'inherit', fontSize: 'inherit', cursor: 'pointer', padding: 0 }}>⌘1/2/3 profile · {profile}</button>
        <span style={{ color: 'rgba(255,255,255,0.25)' }}>·</span>
        <span>⌘E edit · ⌘K command · ⌘, settings</span>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

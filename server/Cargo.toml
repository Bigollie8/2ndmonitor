[package]
name = "hub-marketplace"
version = "0.1.0"
edition = "2021"
description = "Marketplace server for Second-Monitor Hub: accounts, submissions, review queue, signed index"
license = "BUSL-1.1"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
base64 = "0.22"
# SMTP for account verification and password reset. rustls rather than
# native-tls so the server keeps its no-OpenSSL build, matching how ureq
# above is already configured.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "pool"] }
url = "2"
tower-http = { version = "0.7.0", features = ["cors"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

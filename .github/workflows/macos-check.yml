# The only automated verification the macOS port has: `cargo test` here LINKS,
# which is what proves the hand-declared `extern "C"` Core Audio symbols in
# audio_tap.rs actually resolve against the real framework. It therefore has to
# keep running after this branch merges — a Windows-side edit to audio.rs,
# mixer.rs or Cargo.toml can break the macOS build, and without `main` and
# `pull_request` here nobody would find out until `tauri build` failed on
# macos-latest halfway through a tagged release.
name: macOS check
on:
  push:
    branches: [main, worktree-macos-support]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - name: Install frontend deps
        working-directory: app
        run: npm ci
      - name: Frontend typecheck + tests
        working-directory: app
        run: |
          npx tsc --noEmit
          npm test
      - name: Rust check + tests
        working-directory: app/src-tauri
        run: |
          cargo check --all-targets
          cargo test

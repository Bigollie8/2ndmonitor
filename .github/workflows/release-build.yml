# Builds, signs, and publishes the Windows installer + macOS dmg, plus the
# updater artifacts, as a GitHub Release whenever a v* tag is pushed. Both
# platforms are signed with the same minisign key (the two TAURI_SIGNING_*
# secrets) — minisign is cross-platform and the app's pinned pubkey does not
# change, so no Apple codesigning/notarization secrets are used and builds are
# deliberately unsigned on the Apple side.
#
# Why a third job: tauri-action can generate `latest.json` itself
# (includeUpdaterJson: true, the default), but with two platform legs on the
# SAME release, the second leg's latest.json would silently clobber the
# first's — the updater would then only ever see one platform's entry. Both
# legs below set includeUpdaterJson: false and just publish their bundle +
# .sig to the release as before; a separate `publish-manifest` job (needs:
# build, so it waits for both matrix legs) downloads each platform's .sig
# from the release, discovers the matching bundle's real asset name from the
# .sig filename (never guessed/hardcoded — see the "Second-Monitor.Hub" vs.
# "Second-Monitor Hub" space-to-dot sanitizing tauri-bundler does to
# productName in filenames), and uploads one merged `latest.json` covering
# both `windows-x86_64` and `darwin-universal`.
#
# Coexists with announce-release.yml on the same tag: this one publishes the
# artifacts, that one posts to Discord. First live run: the v0.5.1 tag —
# this workflow cannot be end-to-end tested without pushing a tag. macOS
# correctness (both the build itself and the merged manifest's asset
# filenames/URLs) can only be proven by an actual tagged release building on
# macos-latest; see the Task 10 report for what remains unverified.
name: Release build

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      # Universal macOS binary = both Apple Silicon and Intel slices lipo'd
      # together; the runner's default toolchain only has its own host target
      # installed, so both must be added explicitly before `tauri build
      # --target universal-apple-darwin` can build either slice.
      - name: Add Apple Silicon + Intel Rust targets (macOS)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "2ndMonitor ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for details. Installer below; the app auto-updates from this release onward."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # Carry-forward from Task 3: __SANDBOX_ORIGIN__ (vite.config.ts `define`)
      # must resolve to 'vizsandbox://localhost' on macOS / WKWebView, vs.
      # 'http://vizsandbox.localhost' on Windows / WebView2 — see
      # src/sandbox/sandbox-html.ts. macos-check.yml only runs `tsc` + `npm
      # test`, both of which take the tsx fallback branch and never exercise
      # Vite's `define` at all, so this substitution has never actually been
      # built and checked. If it silently failed, the sandbox iframe's src
      # would violate the app's own CSP frame-src and every visualizer would
      # go dark with no runtime error at the failure point. `tauri-action`
      # above already ran `npm run build` as its beforeBuildCommand, so
      # app/dist here is the exact bundle this leg is about to ship —
      # checking it (rather than rebuilding) is the "cheap" verification.
      - name: Assert macOS sandbox origin literal made it into the bundle
        if: matrix.platform == 'macos-latest'
        working-directory: app
        shell: bash
        run: |
          if ! grep -RIl "vizsandbox://localhost" dist >/dev/null 2>&1; then
            echo "::error::__SANDBOX_ORIGIN__ did not resolve to 'vizsandbox://localhost' anywhere in app/dist. The macOS build define is broken: the sandbox iframe's src would violate the app's CSP frame-src and every visualizer would be dead with no runtime error at the failure point."
            exit 1
          fi

  publish-manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout needed: this job only talks to the GitHub Release API via
      # `gh`/`jq`, both preinstalled on the runner image.
      - name: Compose and publish merged updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mkdir dl
          # Both legs' updater signatures end in .sig; nothing else uploaded
          # to this release does. The Windows NSIS updater artifact is the
          # setup .exe itself (`*-setup.exe.sig`); the macOS updater artifact
          # is the .app bundle tarball (`*.app.tar.gz.sig`) — confirmed
          # against this project's own v0.6.4 Windows release rather than
          # guessed, since tauri-bundler sanitizes the productName
          # ("Second-Monitor Hub" -> "Second-Monitor.Hub") in a way that
          # would be easy to get wrong by hand.
          gh release download "$TAG" --pattern "*.sig" --dir dl --clobber

          # Assert exactly one match each rather than letting a silent 0- or
          # 2-match glob feed `basename`/`cat` garbage — a bad match here is
          # exactly the "manifest whose URLs 404" failure mode this job
          # exists to avoid.
          win_matches=(dl/*-setup.exe.sig)
          mac_matches=(dl/*.app.tar.gz.sig)
          if [ "${#win_matches[@]}" -ne 1 ] || [ ! -e "${win_matches[0]}" ]; then
            echo "::error::expected exactly one Windows NSIS .sig asset (*-setup.exe.sig) on release $TAG, found: ${win_matches[*]}"
            exit 1
          fi
          if [ "${#mac_matches[@]}" -ne 1 ] || [ ! -e "${mac_matches[0]}" ]; then
            echo "::error::expected exactly one macOS .app.tar.gz.sig asset on release $TAG, found: ${mac_matches[*]}"
            exit 1
          fi
          win_sig_path="${win_matches[0]}"
          mac_sig_path="${mac_matches[0]}"

          win_asset=$(basename "$win_sig_path" .sig)
          mac_asset=$(basename "$mac_sig_path" .sig)

          win_sig=$(cat "$win_sig_path")
          mac_sig=$(cat "$mac_sig_path")

          version="${TAG#v}"
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
          base_url="https://github.com/${GH_REPO}/releases/download/${TAG}"

          jq -n \
            --arg version "$version" \
            --arg pub_date "$pub_date" \
            --arg win_sig "$win_sig" \
            --arg win_url "${base_url}/${win_asset}" \
            --arg mac_sig "$mac_sig" \
            --arg mac_url "${base_url}/${mac_asset}" \
            '{
              version: $version,
              notes: "See CHANGELOG.md for details. Installer below; the app auto-updates from this release onward.",
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: $win_url },
                "darwin-universal": { signature: $mac_sig, url: $mac_url }
              }
            }' > latest.json

          echo "Composed manifest:"
          cat latest.json

          gh release upload "$TAG" latest.json --clobber

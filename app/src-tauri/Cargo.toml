[package]
name = "second-monitor-hub"
version = "0.6.5"
description = "Second-Monitor Hub"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "second_monitor_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.32", features = ["network"] }
parking_lot = "0.12"
nvml-wrapper = "0.10"
cpal = "0.15"
rustfft = "6"
ureq = { version = "2", features = ["json", "tls"] }
base64 = "0.22"
once_cell = "1"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.8"
tiny_http = "0.12"
png = "0.17"
arboard = "3"
urlencoding = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
# Temps (temps.rs): LibreHardwareMonitor sensors + ACPI thermal zone over WMI.
# Serde-based deserialization of query rows is built into the crate.
wmi = "0.15"
# windows-rs 0.58's #[implement] macro expands to absolute `::windows_core::`
# paths, so the crate has to be in the extern prelude by that name — a
# `use windows::core as windows_core` can't satisfy a leading `::`. Pinned to
# the exact version `windows` 0.58 depends on so cargo unifies them into one
# copy (two copies would make the generated vtables a type mismatch).
windows-core = "=0.58.0"
windows = { version = "0.58", features = [
    # Needed by audio_loopback.rs: ActivateAudioInterfaceAsync requires us to
    # implement IActivateAudioInterfaceCompletionHandler, which needs the
    # #[implement] proc-macro.
    "implement",
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_IO",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

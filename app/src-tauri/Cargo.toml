[package]
name = "second-monitor-hub"
version = "0.8.0"
description = "Second-Monitor Hub"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "second_monitor_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.32", features = ["network"] }
parking_lot = "0.12"
cpal = "0.15"
rustfft = "6"
ureq = { version = "2", features = ["json", "tls"] }
base64 = "0.22"
once_cell = "1"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.8"
tiny_http = "0.12"
png = "0.17"
arboard = "3"
urlencoding = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
# NVML (NVIDIA Management Library) only ships bindings/drivers relevant on
# Windows and Linux desktops with NVIDIA GPUs; macOS has none. sysmon.rs
# treats GPU metrics as optional already, so this simply reports `None` off
# Windows rather than requiring a Linux-specific NVML path too.
nvml-wrapper = "0.10"
# Liquid glass (0.6.6): runtime acrylic behind the transparent main window.
window-vibrancy = "0.6"
# Temps (temps.rs): LibreHardwareMonitor sensors + ACPI thermal zone over WMI.
# Serde-based deserialization of query rows is built into the crate.
wmi = "0.15"
# windows-rs 0.58's #[implement] macro expands to absolute `::windows_core::`
# paths, so the crate has to be in the extern prelude by that name — a
# `use windows::core as windows_core` can't satisfy a leading `::`. Pinned to
# the exact version `windows` 0.58 depends on so cargo unifies them into one
# copy (two copies would make the generated vtables a type mismatch).
windows-core = "=0.58.0"
windows = { version = "0.58", features = [
    # Needed by audio_loopback.rs: ActivateAudioInterfaceAsync requires us to
    # implement IActivateAudioInterfaceCompletionHandler, which needs the
    # #[implement] proc-macro.
    "implement",
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_IO",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Backs the secret store (secrets.rs) with the system Keychain — DPAPI has no
# macOS equivalent, so this is the platform-idiomatic substitute rather than
# an attempt to fake the same encryption boundary.
keyring = "3"
# Backs foreground.rs's frontmost-app lookup via NSWorkspace. The "libc"
# feature is required for NSRunningApplication::processIdentifier(), which
# returns a libc::pid_t; we only ever `as u32` it, so no direct `libc`
# dependency is needed.
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSWorkspace", "NSRunningApplication", "libc"] }
objc2-foundation = "0.2"
# Backs mixer.rs's Core Audio device enumeration / default-output switching
# (AudioObjectGetPropertyData et al. on kAudioObjectSystemObject). Raw bindgen
# bindings, not the higher-level coreaudio-rs wrapper, since we only need a
# handful of AudioObject property calls. core-foundation-sys converts the
# CFStringRef device names to Rust String — the same crate cpal's own
# coreaudio backend uses for this (and already resolves in Cargo.lock via
# cpal's transitive coreaudio-rs dependency), so this doesn't add a new
# family of CF bindings, just our own direct edge to it.
coreaudio-sys = "0.2"
core-foundation-sys = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

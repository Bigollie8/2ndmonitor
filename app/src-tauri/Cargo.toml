[package]
name = "second-monitor-hub"
version = "0.3.0"
description = "Second-Monitor Hub"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "second_monitor_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.32", features = ["network"] }
parking_lot = "0.12"
nvml-wrapper = "0.10"
cpal = "0.15"
rustfft = "6"
ureq = { version = "2", features = ["json", "tls"] }
base64 = "0.22"
once_cell = "1"
sha2 = "0.10"
rand = "0.8"
tiny_http = "0.12"
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The application's own ACL manifest.
#
# WHY THIS FILE EXISTS AT ALL
#
# Tauri only enforces the ACL on an app-defined (non-`plugin:`) command when the
# app ships an ACL manifest:
#
#   tauri-2.10.3/src/webview/mod.rs:1801
#     "we only check ACL on plugin commands or if the app defined its ACL manifest"
#     if (plugin_command.is_some() || has_app_acl_manifest) && invoke.acl.is_none() { reject }
#
# `has_app_acl_manifest` is literally `acl.contains_key("__app-acl__")`
# (tauri-utils-2.8.3/src/acl/mod.rs::has_app_manifest), and that key is inserted
# only when `tauri_build` finds either an `AppManifest::commands([...])` in
# build.rs or a non-empty `src-tauri/permissions/` directory
# (tauri-build-2.5.6/src/acl.rs::build + ::app_manifest_permissions).
#
# Before this file existed the app had neither, so the whole reject block was
# skipped for every command below and execution fell straight through to
# `run_invoke_handler`. `Origin::Remote` was computed (webview/mod.rs:1769) and
# then never consulted. `capabilities/default.json` did not help: it is a
# *capability*, and for app commands `resolve_access` was never called.
#
# The practical consequence: `webtiles` / `browserWebview.ts` mount arbitrary
# user-chosen web pages as child webviews of the main window, and Tauri injects
# the invoke key into every webview unconditionally
# (tauri-2.10.3/src/manager/webview.rs:176,189,501). Any such page could invoke
# `secret_get` and receive DPAPI-decrypted plaintext credentials, plus
# `visualizers_write` (code the app later runs), `marketplace_install`,
# `app_send_hotkey`, `broker_fetch`, ...
#
# The file is written by hand rather than autogenerated via
# `tauri_build::Attributes::app_manifest(AppManifest::new().commands([...]))`
# because that path emits one TOML per command into
# `permissions/autogenerated/` and then requires all 59 `allow-*` identifiers to
# be listed individually in the capability. One permission naming the whole
# command surface keeps the allowlist reviewable in a single place, and keeps
# `build.rs` a bare `tauri_build::build()` (which already scans `permissions/**/*`
# by default).
#
# HOW THE COMMANDS ARE SCOPED
#
# `capabilities/app-commands.json` grants this permission with
# `"webviews": ["main"]` and `"local": true` (the default) and no `remote` block.
# That means a caller must satisfy BOTH:
#   * webview label `main` — `resolve_access` matches `webviews` OR `windows`,
#     so naming `windows` here would have re-admitted `browser-tile`, which is a
#     child webview of the `main` *window*; and
#   * `ExecutionContext::Local` — `Origin::Remote` never matches it
#     (tauri-2.10.3/src/ipc/authority.rs::Origin::matches).
#
# ADDING A COMMAND
#
# A new `#[tauri::command]` registered in `lib.rs`'s `invoke_handler!` must also
# be added below, or it will be rejected everywhere with
# "Command <name> not allowed by ACL". `lib.rs` has a test that pins the two
# lists together so this cannot be forgotten silently.

[[permission]]
identifier = "allow-app-commands"
description = """
Every command the app itself defines. Granted only to the `main` webview from a
local origin — see capabilities/app-commands.json. Child webviews (the browser
tile, which loads arbitrary remote pages) get no app-command access at all;
they neither need nor ever had a legitimate use for one.
"""
commands.allow = [
  # webtiles — child-webview placement. No frontend caller today
  # (src/state/browserWebview.ts drives the JS `Webview` API and the
  # `core:webview:*` plugin permissions instead), kept allowed so this change
  # is a security fix and not also a silent feature removal.
  "position_tile",
  "close_tile",

  # nowplaying — SMTC transport controls (src/state/tauri.ts).
  "media_toggle",
  "media_next",
  "media_previous",

  # discord / discord_rpc (src/state/tauri.ts).
  "discord_connect",
  "discord_disconnect",
  "discord_status",
  "discord_get_client_id",
  "discord_rpc_status",
  "discord_rpc_set_voice_settings",
  "discord_rpc_get_voice_settings",
  "discord_rpc_leave_voice",

  # actions — Stream Deck style actions (src/state/tauri.ts, src/state/actions.ts).
  "app_open_url",
  "app_copy_text",
  "app_send_hotkey",

  # market — outbound HTTP for the built-in data tiles
  # (src/state/{stocks,tides,opensky}.ts).
  "fetch_stock_quotes",
  "fetch_tide_predictions",
  "fetch_aircraft_states",

  # foreground / docker (src/state/{foreground,docker}.ts).
  "foreground_get",
  "docker_list_containers",

  # spotify (src/state/tauri.ts).
  "spotify_status",
  "spotify_connect",
  "spotify_disconnect",
  "spotify_get_client_id",
  "spotify_set_volume",

  # tweaks — the settings store, incl. export/import (src/state/useTweaks.ts, src/App.tsx).
  "tweaks_load",
  "tweaks_save",
  "tweaks_export",
  "tweaks_import",

  # weather / audio engine knobs (src/state/weatherLocation.ts, src/App.tsx,
  # src/state/waveform.ts).
  "set_weather_location",
  # Replays the last forecast to a webview that attached after the emit.
  "weather_current",
  "set_audio_emit_hz",
  "set_waveform_enabled",

  # visualizer audio-source picker — apps currently holding a session
  # (audio_source.rs), plus the swap itself (audio.rs, answers on the
  # `audio:source` event). No frontend caller yet; wired up in a later task.
  "audio_sources_list",
  "audio_set_source",
  "audio_get_source",

  # milkdrop presets (src/components/viz-milkdrop.tsx).
  "presets_list",
  "presets_read",

  # marketplace-installed milkdrop presets: identity (name/author/version),
  # list/read for the picker/catalog.
  "presets_market_list",
  "presets_market_read",

  # installed visualizer bundles, incl. the authoring surface's write path
  # (src/components/{viz-scripted,viz-editor,viz-sandbox-surface,useVizStyles}.tsx).
  "visualizers_list",
  "visualizers_read",
  "visualizers_write",

  # installed tile bundles (src/tiles/useTileCatalog.ts, src/components/DeclarativeTile.tsx).
  "tiles_list",
  "tiles_read",

  # marketplace + the capability broker's fetch backend
  # (src/components/{ContentLibrary,PreviewImage,DeclarativeTile,viz-sandbox-surface}.tsx).
  "marketplace_fetch_index",
  # Market v2: the raw-body fetch feeds the offline index cache, the verify
  # command re-checks a cached body's signature on read, collections are
  # unsigned browse data, and media is the indexed asset fetch behind the
  # detail view's gallery (src/state/{useCatalogData,indexCache}.ts,
  # src/components/PreviewImage.tsx).
  "marketplace_fetch_index_body",
  "marketplace_verify_index_body",
  "marketplace_fetch_collections",
  # 0.9.0 creator profiles. cargo check passes without these; only
  # `cargo test --lib`'s ACL test catches a missing entry, and the runtime
  # failure is "not allowed by ACL" everywhere.
  "marketplace_fetch_creator",
  "marketplace_register",
  "marketplace_verify_account",
  "marketplace_publish_layout",
  # 0.9.0 community layer: follows, favourites, feed, comments, blocks,
  # reports (src/state/social.ts and the market/profile components).
  "marketplace_follow_status",
  "marketplace_set_follow",
  "marketplace_follows_mine",
  "marketplace_fetch_favourites",
  "marketplace_set_favourite",
  "marketplace_fetch_feed",
  "marketplace_fetch_comments",
  "marketplace_post_comment",
  "marketplace_set_block",
  "marketplace_report",
  # Directory, forum and shoutbox (src/state/community.ts).
  "marketplace_fetch_creators",
  "marketplace_fetch_topics",
  "marketplace_create_topic",
  "marketplace_fetch_replies",
  "marketplace_create_reply",
  "marketplace_fetch_shouts",
  "marketplace_post_shout",
  "marketplace_account_get",
  "marketplace_claim_handle",
  "marketplace_account_patch",
  "marketplace_fetch_reviews",
  "marketplace_post_review",
  "marketplace_fetch_preview",
  "marketplace_fetch_media",
  "marketplace_install",
  "marketplace_uninstall",
  "broker_fetch",

  # marketplace sign-in — session token lives in the DPAPI secret store
  # (secrets.rs), never returned to the frontend; only a bool + masked email
  # cross the IPC boundary (src/state/marketplaceAuth.ts).
  "marketplace_login",
  "marketplace_logout",
  "marketplace_session_status",

  # ratings — GET /ratings is public/unsigned (src/components/{CatalogCard,
  # ContentLibrary,StarRating}.tsx); POST /ratings reads the session token
  # Rust-side via secret_get_inner and never accepts or returns it over IPC.
  "marketplace_fetch_ratings",
  "marketplace_rate",

  # first-run seeding (src/App.tsx, src/components/ContentLibrary.tsx).
  "seed_sync",

  # audio mixer (src/state/tauri.ts, src/components/audio-mixer-tile.tsx).
  "mixer_set_master_volume",
  "mixer_set_master_mute",
  "mixer_set_session_volume",
  "mixer_set_session_mute",
  "mixer_set_default_output",
  "mixer_refresh",
  "set_mixer_active",

  # secrets — DPAPI-backed credential store, read by the Settings credential UI
  # (src/state/secrets.ts). This is the command the missing ACL exposed.
  "secret_get",
  "secret_set",
  "secret_delete",

  # tray (src/App.tsx).
  "set_close_to_tray",

  # liquid glass — runtime acrylic behind the transparent window (src/App.tsx).
  "set_glass",

  # sandbox proof token (src/components/viz-sandbox-surface.tsx). Keeps its own
  # `webview.label() != "main"` guard in sandbox.rs as well — the ACL is now the
  # outer gate, that check is the inner one.
  "sandbox_token",
]
